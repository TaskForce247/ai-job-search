name: Local browser application

on:
  push:
    branches: [master]
    paths: ["app/**", "tools/**", ".claude/**", ".agents/**", "cv/**", "cover_letters/**", "documents/README.md", ".github/workflows/local-app.yml"]
  pull_request:
    paths: ["app/**", "tools/**", ".claude/**", ".agents/**", "cv/**", "cover_letters/**", "documents/README.md", ".github/workflows/local-app.yml"]
  workflow_dispatch:
    inputs:
      build_portable:
        description: Build and smoke-check the optional Windows x64 portable package
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  local-application:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install declared backend dependencies
        run: |
          python -m venv app\backend\.venv &&
          & app\backend\.venv\Scripts\python.exe -m pip install --quiet -c app\backend\constraints.txt -e ".\app\backend[dev]"
      - name: Install declared frontend dependencies
        run: npm.cmd --prefix app\frontend ci --no-fund --no-audit
      - name: Verify reviewed package resources and lint
        run: |
          & app\backend\.venv\Scripts\python.exe app\packaging\bundle_resources.py &&
          & app\backend\.venv\Scripts\python.exe -m ruff check app\backend\src app\backend\tests app\backend\export_openapi.py app\packaging\bundle_resources.py app\packaging\local-app.spec
      - name: Check API schema generation
        run: |
          & app\backend\.venv\Scripts\python.exe app\backend\export_openapi.py &&
          npm.cmd --prefix app\frontend run api:generate &&
          git --no-pager diff --exit-code -- app\backend\openapi.json app\frontend\src\api\schema.d.ts
      - name: Backend regression tests
        run: '& app\backend\.venv\Scripts\python.exe -m pytest app\backend\tests -q --basetemp "$env:RUNNER_TEMP\ai-job-search-backend"'
      - name: Frontend tests and types
        run: npm.cmd --prefix app\frontend test && npm.cmd --prefix app\frontend run typecheck
      - name: Browser fixture journeys
        run: npm.cmd --prefix app\frontend run test:e2e
      - name: Real FastAPI browser journey
        run: npm.cmd --prefix app\frontend run test:integration
      - name: Source launch and bundled runtime smoke
        run: '& app\backend\.venv\Scripts\python.exe -m ai_job_search --smoke-test --smoke-report "$env:RUNNER_TEMP\ai-job-search-source-smoke.json"'
      - name: Optional portable build and frozen-runtime smoke
        if: github.event_name == 'workflow_dispatch' && inputs.build_portable
        run: '& app\packaging\build.ps1 -SkipFrontend'
