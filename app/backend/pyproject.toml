[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-search-local"
version = "0.1.0"
description = "Single-user, local AI job search application"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.147.0",
    "uvicorn==0.34.3",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "python-multipart==0.0.22",
    "keyring==25.6.0",
    "PyYAML==6.0.3",
    "pypdf==6.6.2",
    "pypdfium2==5.3.0",
    "pillow==12.2.0",
    "claude-agent-sdk==0.2.168",
    "cryptography==50.0.2",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.14.6",
]

[project.scripts]
ai-job-search = "ai_job_search.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
